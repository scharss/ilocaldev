services:
  # Servicio Web: Apache + PHP Personalizado
  web:
    build:
      context: ./php  # Directorio donde está el Dockerfile de PHP
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3.36}
    image: d7-web:${PHP_VERSION:-8.3.36}
    container_name: mi_app_web_avanzado
    ports:
      - "8080:80"    # Accede a tu app en http://localhost:8080
    volumes:
      - ./src:/var/www/html  # Monta tu código PHP
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom-php.ini # Monta tu php.ini personalizado
    depends_on:
      - db
    networks:
      - app-network
    environment: # <--- AÑADIDO SOLO PARA TZ
      # Establecer la zona horaria para el contenedor web (PHP/Apache)
      TZ: "${TZ:-America/Bogota}"
    # Si tenías variables de la app aquí y las quieres mantener, añádelas.
    # Si no, solo TZ es suficiente para el propósito de la hora.

  # Servicio de Base de Datos: MySQL
  db:
    image: mysql:8.0 # O la versión que prefieras
    container_name: mi_app_db_avanzado
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-mi_base_de_datos}"
      MYSQL_USER: "${MYSQL_USER:-mi_usuario_db}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?define MYSQL_PASSWORD en .env}"
      # Establecer la zona horaria para el contenedor de MySQL
      TZ: "${TZ:-America/Bogota}"
    volumes:
      - db_data_avanzado:/var/lib/mysql # Persistencia de datos de MySQL
    ports:
      - "127.0.0.1:33061:3306" # MySQL solo accesible desde el host
    networks:
      - app-network

  # Servicio phpMyAdmin
  phpmyadmin:
    build:
      context: ./phpmyadmin
      dockerfile: Dockerfile
    image: d7-phpmyadmin:5.2.3-php8.3.36
    container_name: mi_app_phpmyadmin_avanzado
    restart: always
    ports:
      - "127.0.0.1:8081:80"    # phpMyAdmin solo accesible desde el host
    environment:
      PMA_HOST: "${PMA_HOST:-db}"          # Nombre del servicio de la base de datos
      PMA_PORT: "${PMA_PORT:-3306}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}" # Debe coincidir con la de MySQL
      # Establecer la zona horaria para el contenedor de phpMyAdmin
      TZ: "${TZ:-America/Bogota}"
      # Límites de subida y ejecución para importaciones grandes
      UPLOAD_LIMIT: "256M"              # Aplica a upload_max_filesize y post_max_size
      MEMORY_LIMIT: "512M"
      MAX_EXECUTION_TIME: "600"
    depends_on:
      - db
    networks:
      - app-network

volumes:
  db_data_avanzado: # Volumen para persistir los datos de MySQL

networks:
  app-network:
    driver: bridge